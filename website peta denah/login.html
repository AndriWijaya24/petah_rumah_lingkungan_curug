<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Peta Digital Kelurahan Rawa Arum</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-6 md:p-8">
    
    <!-- Header Form -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-100 text-blue-600 rounded-full mb-3">
        📍
      </div>
      <h2 class="text-2xl font-bold text-gray-800">Selamat Datang</h2>
      <p class="text-xs text-gray-500 mt-1">Sistem Peta Digital Kelurahan Rawa Arum</p>
    </div>

    <!-- Alert Notifikasi Error (Sembunyi secara default) -->
    <div id="errorAlert" class="hidden bg-red-100 border border-red-400 text-red-700 text-xs px-3 py-2 rounded-md mb-4 text-center">
      Username atau Password salah!
    </div>

    <!-- Form Input -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      
      <!-- Input Username / NIK -->
      <div class="mb-4">
        <label for="username" class="block text-xs font-semibold text-gray-700 mb-1">Username / NIK</label>
        <input 
          type="text" 
          id="username" 
          placeholder="Masukkan username..." 
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        />
      </div>

      <!-- Input Password -->
      <div class="mb-6">
        <label for="password" class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="••••••••" 
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        />
      </div>

      <!-- Tombol Login -->
      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-md text-sm shadow transition duration-200"
      >
        Masuk ke Peta
      </button>

    </form>

    <!-- Footer Form -->
    <div class="mt-6 text-center text-xs text-gray-400">
      &copy; Kelurahan Rawa Arum, Kec. Grogol, Kota Cilegon
    </div>

  </div>

  <script>
    function handleLogin(event) {
  event.preventDefault();

  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  const alertBox = document.getElementById('errorAlert');

  // GANTI USERNAME DAN PASSWORD DI BAWAH INI:
  if (user === 'petugas' && pass === 'rawaarum2026') {
    alertBox.classList.add('hidden');
    window.location.href = 'index.html'; // Pindah ke peta
  } else {
    alertBox.classList.remove('hidden'); // Tampilkan pesan error jika salah
  }
}
  </script>

</body>
</html>
