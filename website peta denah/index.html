<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denah Peta Digital Kelurahan Rawa Arum</title>
  
  <!-- Tailwind CSS & Leaflet CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    #map { height: 100vh; width: 100%; z-index: 1; }
    .search-container { z-index: 1000; }
  </style>
</head>
<body class="bg-gray-100 font-sans relative">

  <!-- Floating Search Bar -->
  <div class="search-container absolute top-4 left-4 right-4 md:left-16 md:w-96">
    <div class="bg-white p-3 rounded-lg shadow-lg">
      <h1 class="text-sm font-bold text-gray-800 mb-1">Peta Digital Kelurahan</h1>
      <p class="text-xs text-gray-500 mb-2">Kelurahan Rawa Arum, Kec. Grogol, Kota Cilegon</p>
      <div class="relative">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Cari nama warga / no. rumah / lingkungan..." 
          class="w-full px-3 py-2 border rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          oninput="handleSearch()"
        />
        <!-- Dropdown Hasil Pencarian -->
        <div id="searchResults" class="absolute left-0 right-0 bg-white border rounded-b-md shadow-md max-h-60 overflow-y-auto hidden mt-1"></div>
      </div>
    </div>
  </div>

  <!-- Container Peta -->
  <div id="map"></div>

  <!-- Library Leaflet JS & PapaParse JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // =========================================================================
    // KOORDINAT PUSAT KELURAHAN RAWA ARUM (GROGOL, CILEGON)
    // =========================================================================
    const latKelurahan = -5.995000;  // Latitude Pusat Rawa Arum
    const lngKelurahan = 106.028000; // Longitude Pusat Rawa Arum
    const zoomAwal     = 15;         // Zoom level 15 pas untuk melihat seluruh 1 Kelurahan

    // Pembatasan Luas Area Keseluruhan Kelurahan Rawa Arum (+/- 0.035 derajat)
    const areaSelatanBarat = L.latLng(latKelurahan - 0.035, lngKelurahan - 0.035);
    const areaUtaraTimur   = L.latLng(latKelurahan + 0.035, lngKelurahan + 0.035);
    const batasKelurahan   = L.latLngBounds(areaSelatanBarat, areaUtaraTimur);

    // Inisialisasi Peta - Fokus ke Kelurahan Rawa Arum
    const map = L.map('map', {
      maxBounds: batasKelurahan,
      maxBoundsViscosity: 0.6,
      minZoom: 13,                   // Zoom-out minimal agar bisa melihat peta kelurahan utuh
      maxZoom: 19
    }).setView([latKelurahan, lngKelurahan], zoomAwal);

    // Menampilkan Peta Dasar OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© Peta Digital Kelurahan Rawa Arum'
    }).addTo(map);

    let houseData = [];
    const markerMap = new Map();

    // Membaca data_rumah.csv
    Papa.parse('data_rumah.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        houseData = results.data;
        
        houseData.forEach((row, index) => {
          const lat = parseFloat(row.latitude);
          const lng = parseFloat(row.longitude);
          
          const id = row.id ? String(row.id).trim() : `R-${index + 1}`;
          row._cleanId = id;

          if (!isNaN(lat) && !isNaN(lng)) {
            const marker = L.marker([lat, lng]).addTo(map);
            markerMap.set(id, marker);

            const popupContent = `
                <div class="p-1 max-w-xs text-center">
                    <img src="${row.foto}" class="w-full h-32 object-cover rounded-md mb-2" alt="Foto Rumah" onerror="this.src='https://via.placeholder.com/300x150?text=Foto+Tidak+Ada'">
                    <h3 class="font-bold text-base text-gray-800">${row.nama}</h3>
                    <p class="text-xs text-gray-600">${row.no_rumah} - ${row.rt_rw}</p>
                    <p class="text-xs text-gray-500 mb-3">${row.dusun || 'Kel. Rawa Arum'}</p>
                    <a 
                        href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" 
                        target="_blank" 
                        style="color: #ffffff !important; text-decoration: none;"
                        class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs px-3 py-2 rounded shadow transition"
                        >
                        📍 Mulai Rute
                    </a>
                </div>
                `;
            marker.bindPopup(popupContent);
          }
        });
      },
      error: function(err) {
        console.error("Gagal membaca file CSV:", err);
      }
    });

    // Logika Pencarian (Mencari Nama, No Rumah, atau Lingkungan/RT/RW)
    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('searchResults');
      
      if (query.length === 0) {
        resultsContainer.classList.add('hidden');
        return;
      }

      const filtered = houseData.filter(item => {
        const nama = (item.nama || '').toLowerCase();
        const noRumah = (item.no_rumah || '').toLowerCase();
        const dusun = (item.dusun || '').toLowerCase();
        return nama.includes(query) || noRumah.includes(query) || dusun.includes(query);
      });

      if (filtered.length > 0) {
        resultsContainer.innerHTML = filtered.map(item => `
          <div 
            onclick="selectHouse('${item._cleanId}')"
            class="p-2 border-b hover:bg-blue-50 cursor-pointer text-sm"
          >
            <div class="font-semibold text-gray-800">${item.nama}</div>
            <div class="text-xs text-gray-500">${item.no_rumah} (${item.rt_rw}) - ${item.dusun || ''}</div>
          </div>
        `).join('');
        resultsContainer.classList.remove('hidden');
      } else {
        resultsContainer.innerHTML = `<div class="p-2 text-xs text-gray-500 text-center">Data tidak ditemukan</div>`;
        resultsContainer.classList.remove('hidden');
      }
    }

    // Fungsi Fokus & Memperbesar Tampilan ke Rumah yang Dipilih
    function selectHouse(id) {
      const marker = markerMap.get(String(id).trim());
      if (marker) {
        const latLng = marker.getLatLng();
        
        // Terbang dari skala kelurahan langsung ke skala detail rumah (zoom 18)
        map.flyTo(latLng, 18, {
          animate: true,
          duration: 1.5
        });
        
        setTimeout(() => {
          marker.openPopup();
        }, 1600);

        document.getElementById('searchResults').classList.add('hidden');
      } else {
        console.warn("Marker tidak ditemukan untuk ID:", id);
      }
    }
  </script>
</body>
</html>
